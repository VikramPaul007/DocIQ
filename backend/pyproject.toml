[project]
name = "dociq-backend"
version = "0.1.0"
description = "DocIQ API and worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "jsonschema>=4.23",
    "google-re2>=1.1",
    "cryptography>=43.0",
    "boto3>=1.35",
    "openai>=1.54",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
]

[project.optional-dependencies]
worker = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
# S101: assert is fine in tests; per-file-ignore below.
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# S101/S105/S106: assert and literal test passwords are fine in tests.
# S311: fake client IPs for rate-limit isolation, not security-sensitive.
"tests/*" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
